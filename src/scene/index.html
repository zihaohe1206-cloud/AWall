<!doctype html><html><head><meta charset="utf-8"><style>html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#error{position:absolute;inset:20px;color:#ffd2d2;font:16px sans-serif;white-space:pre-wrap;pointer-events:none}</style></head><body><div id="stage"></div><div id="error"></div><script src="webwallgl.global.min.js"></script><script>
'use strict';
const send = (type, value) => chrome.webview.postMessage({type,value});
let scene, requestedPause=false, dead=false;
window.awallPause = paused => { requestedPause=paused; if(scene) paused?scene.pause():scene.resume(); };
window.awallPointer = (u,v) => { if(scene&&!requestedPause) scene.pushPointer(u,v,0); };
window.awallStats = () => ({ready:!!scene,info:scene?.info,stats:scene?.stats,paused:scene?.paused});
// The host copies the PKG into WebView2 shared memory before sending 'load'.
// Register before 'boot' so the buffer cannot arrive without a listener.
let pkgBufferResolve; const pkgBuffer=new Promise(resolve=>pkgBufferResolve=resolve);
chrome.webview.addEventListener('sharedbufferreceived',e=>{ if(e.additionalData&&e.additionalData.type==='pkg') pkgBufferResolve(e.getBuffer()); });
addEventListener('error',e=>send('error',e.message));
addEventListener('unhandledrejection',e=>send('error',String(e.reason?.stack||e.reason)));
chrome.webview.addEventListener('message',async e=>{
 if(e.data.type!=='load'||scene) return;
 try {
  const source=WebWallGL.httpSource('https://wallpaper.awall.local');
  if(e.data.pkg){
   source.sceneDir=async()=>null;
   const fetchPkg=async signal=>{const r=await fetch('https://wallpaper.awall.local/'+encodeURIComponent(e.data.pkg),{signal});if(!r.ok)throw Error('PKG 文件读取失败：'+r.status);return r.arrayBuffer();};
   source.scenePkg=async signal=>{
    if(e.data.buffered){
     const buffer=await Promise.race([pkgBuffer,new Promise(resolve=>setTimeout(()=>resolve(null),10000))]);
     if(buffer) return buffer;
     send('diagnostic',{level:'info',message:'共享内存 PKG 未送达，回退到 fetch'});
    }
    return fetchPkg(signal);
   };
   const original=source.project;
   source.project=async signal=>({...await original(signal),type:'scene',file:e.data.pkg});
  }
  scene=await WebWallGL.mount(document.querySelector('#stage'),{
   source,
   fit:'cover',fps:30,volume:0,renderDpr:1,scripts:true,audio:null,media:null,
   mountTimeoutMs:45000,
   onDiagnostic:(message,level)=>send('diagnostic',{message,level}),
   onError:error=>{dead=true;document.querySelector('#error').textContent='场景渲染失败：'+error.message;send('error',String(error.stack||error));}
  });
  if(dead)return;
  // mount() produces a first frame; let it reach the compositor before
  // replacing the old native wallpaper window or applying a pending pause.
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  if(dead)return;
  if(requestedPause)scene.pause();
  send('ready',{info:scene.info,stats:scene.stats});
 } catch(error) { document.querySelector('#error').textContent='场景加载失败：'+error.message;send('error',String(error.stack||error)); }
});
send('boot',{});
</script></body></html>
